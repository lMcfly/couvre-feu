name: Vérifications
on: [push, pull_request]
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: index.html correspond à src/
        run: node tools/build.js --out /tmp/assemble.html && cmp /tmp/assemble.html index.html
      - name: Vérifications du code
        run: node tools/check.js
